name: product-verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm web:build
      - name: Lint Moodle PHP
        shell: bash
        run: |
          find apps/moodle -type f -name '*.php' -print0 | xargs -0 -n1 php -l

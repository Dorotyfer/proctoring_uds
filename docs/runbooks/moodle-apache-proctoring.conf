# The public HTTPS gateway terminates TLS and forwards HTTP to this Apache host.
<VirtualHost *:80>
    ServerName campus.uds.edu.py
    DocumentRoot /var/www/moodle

    <Directory /var/www/moodle>
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /proctoring-api/ http://192.168.71.91/api/
    ProxyPassReverse /proctoring-api/ http://192.168.71.91/api/
    ProxyPass        /proctoring/     http://192.168.71.91/
    ProxyPassReverse /proctoring/     http://192.168.71.91/
    ProxyPass        /_next/          http://192.168.71.91/_next/
    ProxyPassReverse /_next/          http://192.168.71.91/_next/

    ErrorLog ${APACHE_LOG_DIR}/moodle_error.log
    CustomLog ${APACHE_LOG_DIR}/moodle_access.log combined
</VirtualHost>

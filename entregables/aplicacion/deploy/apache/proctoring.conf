# TLS terminates at the institutional gateway before this Apache vhost.
<VirtualHost *:80>
  ServerName campus.uds.edu.py
  DocumentRoot /var/www/moodle

  <Directory /var/www/moodle>
    AllowOverride All
    Require all granted
  </Directory>

  ProxyRequests Off
  ProxyPreserveHost On
  RequestHeader unset Proxy early
  RequestHeader unset X-Forwarded-For early
  RequestHeader unset X-Forwarded-Host early
  RequestHeader unset X-Forwarded-Proto early
  RequestHeader unset X-Forwarded-Port early
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Port "443"
  RequestHeader set X-Forwarded-Host "expr=%{HTTP_HOST}"

  ProxyPass        /proctoring-api/ http://127.0.0.1:8000/ connectiontimeout=5 timeout=65 retry=0
  ProxyPassReverse /proctoring-api/ http://127.0.0.1:8000/
  ProxyPass        /proctoring/ http://127.0.0.1:8000/ connectiontimeout=5 timeout=65 retry=0
  ProxyPassReverse /proctoring/ http://127.0.0.1:8000/

  <Location /proctoring-api/>
    Require all granted
    LimitRequestBody 700000
  </Location>

  <Location /proctoring/>
    Require all granted
    LimitRequestBody 700000
  </Location>

  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "no-referrer"
  # FastAPI emits a route-specific CSP. Do not set or overwrite CSP here.

  ErrorLog ${APACHE_LOG_DIR}/moodle_error.log
  LogFormat "%a %l %u %t \"%m %U %H\" %>s %b \"%{User-Agent}i\"" proctoring_no_query
  CustomLog ${APACHE_LOG_DIR}/moodle_access.log proctoring_no_query
</VirtualHost>
